# 최초 도메인 연결용 HTTP 부트스트랩 설정이다.
# Certbot 적용 후 운영 서버의 이 파일에는 SSL 블록이 자동 추가되므로,
# 이 템플릿으로 운영 설정을 그대로 덮어쓰지 않는다.
server {
    listen 80 default_server;
    server_name _ thevault73.com www.thevault73.com app.thevault73.com;
    root /var/www/the-vault/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' mailto:; object-src 'none'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; media-src 'self'; connect-src 'self' https://wbereepcsltlwckimfcv.supabase.co wss://wbereepcsltlwckimfcv.supabase.co; worker-src 'self' blob:" always;

    location = /preview/mobile-v2 {
        return 301 /preview/mobile-v2/;
    }

    location = /preview/mobile-v2/app/manifest.webmanifest {
        alias /var/www/the-vault-previews/mobile-v2/current/app/manifest.webmanifest;
        default_type application/manifest+json;
        expires 1h;
    }

    location = /preview/mobile-v2/app/service-worker.js {
        alias /var/www/the-vault-previews/mobile-v2/current/app/service-worker.js;
        expires -1;
    }

    location ^~ /preview/mobile-v2/ {
        alias /var/www/the-vault-previews/mobile-v2/current/;
        index index.html;
    }

    location = / {
        if ($host = app.thevault73.com) {
            return 302 /app/;
        }

        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /app/service-worker.js {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|mp4|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(?:md|pem|key|env|toml|ya?ml)$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
